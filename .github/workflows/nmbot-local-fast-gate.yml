name: nmbot local fast gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-fast-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"

      - name: Install locked dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary :all: -r requirements-deploy.lock
          python -m pip check

      - name: Run local docs/contracts/quality gate
        run: python scripts/nmbot_check.py docs contracts quality
