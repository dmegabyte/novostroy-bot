name: nmbot TEST atomic release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Optional human reason for this TEST release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nmbot-test-atomic-release
  cancel-in-progress: false

jobs:
  test-release:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run local fast gate
        run: |
          set -euo pipefail
          python scripts/nmbot_check.py docs contracts quality

      - name: Configure TEST SSH
        env:
          NMBOT_TEST_SSH_PRIVATE_KEY: ${{ secrets.NMBOT_TEST_SSH_PRIVATE_KEY }}
          NMBOT_TEST_SSH_KNOWN_HOSTS: ${{ secrets.NMBOT_TEST_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$NMBOT_TEST_SSH_PRIVATE_KEY"
          test -n "$NMBOT_TEST_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$NMBOT_TEST_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$NMBOT_TEST_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Run guarded TEST-only atomic release
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          release_id="test-$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_NUMBER}-${short_sha}"
          python3 scripts/nmbot_atomic_release.py test-release --release-id "$release_id" --auto-overlays --confirm

      - name: Summary
        if: always()
        run: |
          printf '%s\n' 'TEST atomic release runs the guarded deploy only. A manual Jivo smoke remains required.' >> "$GITHUB_STEP_SUMMARY"
