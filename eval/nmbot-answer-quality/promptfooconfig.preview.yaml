# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "nmbot live answer quality regression — local preview/no LLM cost"

prompts:
  - file://prompts/answer.md

providers:
  - echo

tests: file://tests/live-run-cases.yaml

defaultTest:
  assert:
    - type: python
      value: file://scripts/answer_quality_assert.py:get_assert
      threshold: 0.75

commandLineOptions:
  maxConcurrency: 1

outputPath: results/preview-results.json
